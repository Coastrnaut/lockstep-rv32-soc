name: VHDL Compile & Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Stream output live, so a timed-out job shows which test was running.
  PYTHONUNBUFFERED: "1"

jobs:
  vhdl-regression:
    # Pinned: this image decides the GHDL version that apt installs.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install GHDL (mcode backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl

      - name: Install VUnit & VSG
        run: |
          pip install vunit_hdl==4.7.1 vsg==3.35.0

      - name: Semantic safety lint (ghdl -Wall)
        run: |
          cd sim && python run.py --lint

      - name: Style lint (vsg)
        run: |
          cd sim && python run.py --vsg

      - name: Compile and run full regression
        # Fails the step, not the job, so the logs below still get uploaded.
        timeout-minutes: 5
        run: |
          cd sim && mkdir -p reports && python run.py

      - name: Upload simulation logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sim-logs
          path: |
            sim/vunit_out/test_output/**/*.txt
            sim/vunit_out/test_output/**/*.html
