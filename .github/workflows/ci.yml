name: VHDL Compile & Regression

# Lint, regression and the cheap evidence checks, on every push to main and
# every pull request. Each run publishes a pass/fail summary, its xUnit file
# and a tool and submodule manifest, and its logs when it fails.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Stream output live, so a timed-out job shows which test was running.
  PYTHONUNBUFFERED: "1"

jobs:
  vhdl-regression:
    # Pinned: this image decides the GHDL version that apt installs.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install GHDL (mcode backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl

      - name: Install pinned VUnit & VSG
        run: |
          pip install -r sim/requirements.txt

      - name: Tool and submodule manifest
        # Fails if GHDL, VUnit or VSG is missing
        run: |
          python sim/scripts/ci_report.py manifest sim/vunit_out/tool_manifest.json

      - name: Generated fixtures match their generators
        run: |
          python sim/scripts/check_fixtures.py

      - name: Mutation patterns still apply to the RTL
        run: |
          python sim/scripts/mutate.py --check

      - name: Documents cite only evidence that exists
        run: |
          python sim/scripts/check_evidence.py

      - name: FMEDA input table is well formed
        run: |
          python sim/scripts/fmeda.py --selftest
          python sim/scripts/fmeda.py --check

      - name: Semantic safety lint (ghdl -Wall, ghdl --synth)
        run: |
          cd sim && python run.py --lint

      - name: Style lint (vsg)
        run: |
          cd sim && python run.py --vsg

      - name: Compile and run full regression
        # The lint gates ran above, so LOCKSTEP_NO_LINT skips running them twice
        timeout-minutes: 8
        env:
          LOCKSTEP_NO_LINT: "1"
        run: |
          cd sim && mkdir -p reports vunit_out
          python run.py -p 4 --xunit-xml vunit_out/regression.xml 2>&1 | tee vunit_out/regression.log
          exit "${PIPESTATUS[0]}"

      - name: Regression summary
        if: always()
        run: |
          python sim/scripts/ci_report.py summary sim/vunit_out/regression.xml --log sim/vunit_out/regression.log

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-evidence
          path: |
            sim/vunit_out/regression.xml
            sim/vunit_out/tool_manifest.json
          if-no-files-found: warn

      - name: Upload simulation logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sim-logs
          path: |
            sim/vunit_out/regression.log
            sim/vunit_out/test_output/**/*.txt
            sim/vunit_out/test_output/**/*.html

  formal:
    # Roadmap R2.1: proofs of the comparator, the bus fabric and the store
    # commit, with a deliberately broken RTL for each that must fail
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install GHDL (mcode backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl

      - name: Install pinned formal tools
        run: |
          pip install -r sim/requirements-formal.txt

      - name: Prove, cover, and reject broken RTL
        run: |
          python sim/scripts/run_formal.py --broken

      - name: Upload formal results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formal-results
          path: |
            sim/formal/build/results.json
            sim/formal/build/results.md
            sim/formal/build/*/sby.log
          if-no-files-found: warn

  board:
    # Roadmap R3.1 and R3.3: the Arty A7 wrapper synthesises in GHDL, and the
    # board image runs on the SoC. The Vivado build itself needs a licence-free
    # Vivado install with Artix-7 devices, which CI does not have.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install GHDL (mcode backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl

      - name: Check the board wrapper and the board image
        run: |
          python fpga/arty_a7_100t/check_board.py
