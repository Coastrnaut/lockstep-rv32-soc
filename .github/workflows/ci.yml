name: VHDL Compile & Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  vhdl-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GHDL (mcode backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl

      - name: Install VUnit
        run: |
          pip install vunit_hdl

      - name: Compile all VHDL sources
        run: |
          cd sim
          python run.py --compile

      - name: Run full regression (auto-discover all testbenches)
        run: |
          cd sim && python run.py

      - name: Upload simulation logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs
          path: |
            vunit_out/test_output/**/*.txt
            vunit_out/test_output/**/*.html
