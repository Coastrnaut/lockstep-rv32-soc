name: VHDL Compile & Regression

# Lint, regression and the cheap evidence checks, on every push to main and
# every pull request. Each run publishes a pass/fail summary, its xUnit file
# and a tool and submodule manifest, and its logs when it fails.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Stream output live, so a timed-out job shows which test was running.
  PYTHONUNBUFFERED: "1"

jobs:
  vhdl-regression:
    # Pinned: this image decides the GHDL version that apt installs.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install GHDL (mcode backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl

      - name: Install pinned VSG
        run: |
          pip install -r sim/requirements.txt

      - name: Tool and submodule manifest
        # Fails if GHDL or VSG is missing
        run: |
          python tools/ci_report.py manifest sim/out/tool_manifest.json

      - name: Generated fixtures match their generators
        run: |
          python tools/check_fixtures.py

      - name: Mutation patterns still apply to the RTL
        run: |
          python sim/scripts/mutate.py --check

      - name: Documents cite only evidence that exists
        run: |
          python tools/check_evidence.py

      - name: FMEDA input table is well formed
        run: |
          python tools/fmeda.py --selftest
          python tools/fmeda.py --check

      - name: Semantic safety lint (ghdl -Wall, ghdl --synth)
        run: |
          cd sim && python run.py --lint

      - name: Style lint (vsg, every rule)
        run: |
          cd sim && python run.py --vsg

      - name: Compile and run full regression on GHDL
        # The lint gates ran above, so LOCKSTEP_NO_LINT skips running them twice.
        # CI has no Vivado; run.py adds xsim and compares the two when it finds one.
        timeout-minutes: 10
        env:
          LOCKSTEP_NO_LINT: "1"
        run: |
          cd sim && mkdir -p out
          python run.py --sim ghdl -p 4 --xunit-xml out/regression.xml 2>&1 | tee out/regression.log
          exit "${PIPESTATUS[0]}"

      - name: Regression summary
        if: always()
        run: |
          python tools/ci_report.py summary sim/out/regression.xml --log sim/out/regression.log

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-evidence
          path: |
            sim/out/regression.xml
            sim/out/tool_manifest.json
          if-no-files-found: warn

      - name: Upload simulation logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sim-logs
          path: |
            sim/out/regression.log
            sim/out/ghdl/**/output.txt

  formal:
    # Roadmap R2.1: proofs of the comparator, the bus fabric and the store
    # commit, with a deliberately broken RTL for each that must fail
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install GHDL (mcode backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl

      - name: Install pinned formal tools
        run: |
          pip install -r sim/requirements-formal.txt

      - name: Prove, cover, and reject broken RTL
        run: |
          python sim/scripts/run_formal.py --broken

      - name: Upload formal results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formal-results
          path: |
            sim/formal/build/results.json
            sim/formal/build/results.md
            sim/formal/build/*/sby.log
          if-no-files-found: warn

  board:
    # Roadmap R3.1 and R3.3: the Arty A7 wrapper synthesises in GHDL, and the
    # board image runs on the SoC. The Vivado build, and run.py's xsim runs,
    # need a Vivado install, which CI does not have.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install GHDL (mcode backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl

      - name: Check the board wrapper and the board image
        run: |
          python fpga/arty_a7_100t/check_board.py

      - name: Install the pinned RISC-V compiler (xPack GCC 15.2.0-1)
        run: |
          v=15.2.0-1
          f=xpack-riscv-none-elf-gcc-$v-linux-x64.tar.gz
          url=https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v$v
          curl -fsSL -o "$f" "$url/$f"
          curl -fsSL -o "$f.sha" "$url/$f.sha"
          sha256sum -c "$f.sha"
          tar -xzf "$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xpack-riscv-none-elf-gcc-$v/bin" >> "$GITHUB_PATH"

      - name: The board image is a build of sw/board with the pinned compiler
        run: |
          python sw/build.py --check
