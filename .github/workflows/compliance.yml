name: ISO 26262 Compliance Gate

on:
  pull_request:
    branches: [ main ]

jobs:
  lint_and_test:
    # Pinned: this image decides the GHDL version that apt installs.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify PR Description Contains Safety Checklist
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            if (!body.includes("ISO 26262 ASIL-D / SafeVHDL Design Review Checklist")) {
              core.setFailed("PR description is missing the mandatory Automotive VHDL Safety Checklist.");
            }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install GHDL & VUnit
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl
          pip install vunit_hdl==4.7.1

      - name: Compile VHDL Sources
        run: |
          python3 sim/run.py --compile

      - name: Run Testbenches
        run: |
          python3 sim/run.py

      - name: Check GHDL Exit Status
        if: always()
        run: |
          echo "Simulation complete. Check logs for coverage reports."
