name: PR Safety Checklist Gate

# Checks one thing: that the pull request description carries the design
# review checklist of docs/safety/PR_CHECKLIST.md. It does not review the
# checklist's answers. Lint, regression and the evidence checks for the same
# pull request run in ci.yml ("VHDL Compile & Regression"), so they are not
# repeated here. Neither workflow measures structural coverage, runs netlist
# fault injection or proves properties.

on:
  pull_request:
    branches: [ main ]

jobs:
  checklist:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: PR description contains the safety checklist
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            if (!body.includes("ISO 26262 ASIL-D / SafeVHDL Design Review Checklist")) {
              core.setFailed("PR description is missing the mandatory Automotive VHDL Safety Checklist.");
            }
