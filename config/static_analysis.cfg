# ============================================================================
# Static Analysis Configuration
# ============================================================================
# SafeVHDL / SafeRisc linting rules for lockstep-rv32-soc
# ============================================================================

# SafeVHDL Rules
# Run: safervhdlrisc --vhdl-2008 <file>

[general]
# Enforce VHDL-2008 strict mode
vhdl_standard = 2008

# Block inferred latches
latch_detection = error

# Require complete sensitivity lists
sensitivity_check = error

# Require signal initialization
init_check = warning

# Block mixed clock edges
clock_check = error

# Enforce naming conventions
naming_check = warning

# Require explicit reset handling
reset_check = error

# Block use of non-standard packages
package_check = error
allowed_packages = ieee.std_logic_1164, ieee.numeric_std, lockstep.package_soc_types

# Traceability attribute check
traceability_check = error
required_attribute = requirement_id
