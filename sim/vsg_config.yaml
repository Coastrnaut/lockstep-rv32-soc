# ==============================================================================
# ISO 26262-6 ASIL D Safety-Critical VHDL Linting Configuration
# Target: lockstep-rv32-soc Hand-Written Platform Core Stack
# Enforces strict deterministic constraints to eliminate systematic bugs
# ==============================================================================

# Global configuration applied across all analyzed structures
global:
  severity: error  # Elevate all failures to errors to force clean CI regression blocks

# ----------------------------------------------------------------------------
# BROAD WHATEVER/STYLE/ALIGNMENT GROUPS (Enforces Readability & Reviewability)
# Highly recommended by ISO 26262-6 Table 1 for unambiguous design code
# ----------------------------------------------------------------------------
group:
  # 1. Enforce strict uppercase/lowercase restrictions across all keywords
  case:
    enabled: true
  case::keyword:
    enabled: true

  # 2. Strict indentation compliance across nested conditional code blocks
  indent:
    enabled: true

  # 3. Clean spatial alignments for assignments and structural ports
  alignment:
    enabled: true

  # 4. Forbid excessive whitespace formatting variations
  whitespace:
    enabled: true

  # 5. Maintain standardized layout margins and file limits
  length:
    enabled: true

# ----------------------------------------------------------------------------
# GRANULAR CONFIGURABLE SAFETY RULES (ISO 26262 Safe Synthesis Subset)
# ----------------------------------------------------------------------------
rule:
  # === SECTION A: DEFENSIVE FINITE STATE MACHINES & CONTROL FLOW ===
  case_006:
    # Requires 'when others =>' across all state evaluation structures
    must_have_when_others: true
  case_007:
    # Explicitly prohibits assigning an unmapped 'null' step within default escape blocks
    allow_null_in_when_others: false
  if_001:
    # Forces structural 'then' placements to align to clean indentation blocks
    enabled: true
  if_035:
    # Mandates structured matching block endings for multi-branch structures
    enabled: true

  # === SECTION B: STABILIZED INTERFACE NAMING & PORT PREFIXES ===
  port_011:
    # Enforces exact naming behaviors on entity port maps
    prefix: ""
  port_025:
    # Mandates explicit safety directional suffixes to prevent phase inversion loops
    input_direction:
      suffix: "_i"
    output_direction:
      suffix: "_o"
    # Prohibit the use of bidirectional 'inout' pins on internal cores to avoid bus contention
    inout_direction:
      forbidden: true

  # === SECTION C: CLOCK DOMAIN IDENTIFICATION & ASYNCHRONOUS CONSTRAINTS ===
  signal_008:
    # Regulate common layout prefix parameters for design fabrics
    prefix: ""
  signal_600:
    # Separate clock trees and reset vectors distinctly to simplify Clock Domain Crossing analysis
    clock_signals:
      prefix: "clk_"
      suffix: "_i"
    reset_signals:
      prefix: "rst_"
      suffix: "_n_i"

  # === SECTION D: STRUCTURAL COMPLIANCE & RE-SIMULATION MARGINS ===
  process_014:
    # Strictly mandates full sensitivity lists for combinational logic blocks
    # Minimizes risk of severe RTL-versus-Gate-Level post-synthesis mismatches.
    must_have_complete_sensitivity_list: true
  process_015:
    # Prohibits variables inside sequential clocked logic to block unintended hidden latch slips
    allow_variables_in_clocked_processes: false
  signal_001:
    # Blocks multiple signals from sharing a single declaration line
    # Every data line must be isolated for clean upwards traceability mapping.
    enabled: true

  # === SECTION E: HARDWARE DETERMINISM & TYPE SAFETY ===
  type_001:
    # Completely forbids unconstrained type variables (such as dynamic integers)
    # All signals must map to fixed arrays (std_logic_vector, signed, unsigned).
    allow_unconstrained_integer: false
  constant_001:
    # Forces constants to use rigorous width specification definitions
    enabled: true

  # === SECTION F: NON-SYNTHESIZABLE LANGUAGEConstruct BAN ===
  wait_001:
    # Forbids the 'wait for' timing loops inside logic circuits
    # Simulation timing constructs will block or mask physical gate delay calculations.
    wait_for_statement:
      forbidden: true
  attribute_declaration_300:
    # Restricts user-defined non-standard properties that alter translation properties
    enabled: true
  attribute_specification_300:
    enabled: true

  # === SECTION G: ENTITY INSTANTIATIONS (Required for cross-library binding) ===
  instantiation_034:
    # Allow entity instantiations — required for NEORV32 cross-library binding
    disable: true
  instantiation_036:
    # Allow entity instantiations without architecture identifier
    disable: true
