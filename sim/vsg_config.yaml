# ==============================================================================
# ISO 26262 ASIL D Safety-Critical VHDL Linting Configuration
# Platform Target: lockstep-rv32-soc
# Framework: VHDL Style Guide (VSG)
# ==============================================================================

# Global Ruleset Adaptation
global:
  # Elevate rule failures to 'error' to guarantee clean automated CI failures
  severity: error

rule:
  # ----------------------------------------------------------------------------
  # 1. DEFENSIVE FSM & CASE STATEMENT MANDATES (ISO 26262-6 Table 4 / Table 7)
  # Prevents infinite lockups and illegal state entry due to transient bit slips.
  # ----------------------------------------------------------------------------
  case_statement_001:
    # Force the mandatory inclusion of 'when others =>' across all case blocks
    # Ensure unmapped bit combinations drive the hardware back to a safe reset.
    must_have_when_others: true
    
  case_statement_002:
    # Prohibit 'null' or unhandled statements inside 'when others =>' paths
    allow_null_in_when_others: false

  # ----------------------------------------------------------------------------
  # 2. STRICT PORT & SIGNAL NAMING CONSTRAINTS
  # Eliminates integration assembly bugs, phase inversion, or clock routing errors.
  # ----------------------------------------------------------------------------
  port_001:
    # Mandate strict suffix/prefix rules for input interfaces
    input_direction:
      prefix: ""
      suffix: "_i"
  port_002:
    # Mandate strict suffix/prefix rules for output interfaces
    output_direction:
      prefix: ""
      suffix: "_o"
  port_003:
    # Prohibit the use of bidirectional 'inout' pins on internal safety wrappers
    # to prevent bus contention issues.
    inout_direction:
      forbidden: true

  signal_001:
    # Mandate clock naming conventions to prevent clock-domain crossing hazards
    clock_signals:
      prefix: "clk_"
      suffix: "_i"
  signal_002:
    # Enforce clear visual separation of active-low asynchronous reset nets
    reset_signals:
      prefix: "rst_"
      suffix: "_n_i"

  # ----------------------------------------------------------------------------
  # 3. TYPE CASTING & HARDWARE DETERMINISM RULES
  # Mitigates implicit compiler optimization quirks or width truncation hazards.
  # ----------------------------------------------------------------------------
  type_001:
    # Ban non-deterministic standard types (like integer without constraints)
    # Mandate fixed-width types: std_logic_vector, signed, or unsigned.
    allow_unconstrained_integer: false

  expression_001:
    # Ban implicit array sizing logic. All assignment widths must be matched, 
    # ensuring the synthesis engine doesn't silently slice critical data lines.
    allow_implicit_width_matching: false

  # ----------------------------------------------------------------------------
  # 4. STRUCTURAL MODULARITY & ISOLATION RULES (ISO 26262-6 Table 3)
  # Ensures bidirectional traceability between software requirements and RTL code.
  # ----------------------------------------------------------------------------
  entity_001:
    # Mandate matching block labels on entity architectures to ease AST compilation
    architecture_matching_label: true

  process_001:
    # Require explicit sensitivity lists for combinational logic blocks
    # Prevents RTL simulation from mismatching post-synthesis Gate-Level Netlists.
    must_have_complete_sensitivity_list: true

  process_002:
    # Prohibit variables inside multi-clock processes to eliminate hidden state 
    # latch generation that escapes standard validation.
    allow_variables_in_clocked_processes: false

  # ----------------------------------------------------------------------------
  # 5. UNSYNTHESIZABLE & DYNAMIC LANGUAGE BAN
  # Banned completely under ASIL D as they introduce random simulation drift.
  # ----------------------------------------------------------------------------
  keyword_001:
    # Exclude simulation-only timing delays inside synthesized hardware
    wait_for_statement:
      forbidden: true
  keyword_002:
    # Prohibit dynamic pointers and allocations ('new', 'access')
    access_type_allocation:
      forbidden: true