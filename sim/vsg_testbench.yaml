  alias_declaration_600:
    disable: true
  # off in benches: VUnit runs every test of a bench from one process, so a bench's process grows with its test count
  length_003:
    disable: true
  # off in benches: bench signals carry the name of the DUT port they drive or watch, so a failing check names the port
  signal_008:
    disable: true
